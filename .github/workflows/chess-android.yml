name: Build Chess Android APK

# Runs the chess engine unit tests and builds installable debug + release APKs
# for the native Kotlin/Compose chess app under chess-android/.
on:
  workflow_dispatch:
  push:
    branches: [claude/android-chess-game-ctcena]
    paths:
      - 'chess-android/**'
      - '.github/workflows/chess-android.yml'
  pull_request:
    paths:
      - 'chess-android/**'
      - '.github/workflows/chess-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run engine unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-chess-debug-apk
          path: chess-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-chess-release-apk
          path: chess-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: chess-android/app/build/reports/tests/
          if-no-files-found: ignore
